<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TV-Gue Online Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #1e293b;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
    }
    header h1 { font-size: 1.1rem; color: #38bdf8; }
    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .sidebar {
      width: 340px;
      background: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
    }
    .controls {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid #334155;
    }
    input, select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 0.9rem;
    }
    .channel-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }
    .channel-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .channel-item:hover { background: #334155; }
    .channel-item.active { background: #0284c7; color: #fff; }
    .channel-item img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      background: #0f172a;
      border-radius: 4px;
      padding: 2px;
      flex-shrink: 0;
    }
    .channel-info { overflow: hidden; }
    .channel-name {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .channel-group {
      font-size: 0.72rem;
      color: #94a3b8;
    }
    .channel-item.active .channel-group { color: #e0f2fe; }
    .player-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #000;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 95px);
      background: #000;
    }
    .now-playing {
      background: #1e293b;
      padding: 10px 16px;
      font-size: 0.9rem;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-badge {
      font-size: 0.78rem;
      padding: 3px 8px;
      border-radius: 4px;
      background: #334155;
      color: #cbd5e1;
    }
    @media (max-width: 768px) {
      .container { flex-direction: column-reverse; }
      .sidebar { width: 100%; height: 55vh; }
      video { max-height: 35vh; }
    }
  </style>
</head>
<body>
  <header>
    <h1>📺 TV-Gue Web Player</h1>
    <span id="counter" class="status-badge">Memuat playlist...</span>
  </header>

  <div class="container">
    <aside class="sidebar">
      <div class="controls">
        <select id="groupFilter">
          <option value="ALL">Semua Kategori</option>
        </select>
        <input type="text" id="searchInput" placeholder="Cari channel atau judul film..." />
      </div>
      <div id="channelList" class="channel-list"></div>
    </aside>

    <main class="player-area">
      <video id="video" controls autoplay playsinline></video>
      <div class="now-playing">
        <span id="currentTitle">Pilih channel atau film di daftar samping</span>
        <span id="playerStatus" class="status-badge">Siap</span>
      </div>
    </main>
  </div>

  <script>
    // Membaca langsung file daftar2_full.m3u di folder yang sama pada GitHub Pages
    const M3U_URL = "./daftar2_full.m3u";

    let allChannels = [];
    let hls = null;

    const video = document.getElementById("video");
    const channelListEl = document.getElementById("channelList");
    const groupFilterEl = document.getElementById("groupFilter");
    const searchInputEl = document.getElementById("searchInput");
    const currentTitleEl = document.getElementById("currentTitle");
    const playerStatusEl = document.getElementById("playerStatus");
    const counterEl = document.getElementById("counter");

    function parseM3U(text) {
      const lines = text.split(/\r?\n/);
      const items = [];
      let current = null;

      for (let raw of lines) {
        const line = raw.trim();
        if (!line) continue;

        if (line.startsWith("#EXTINF")) {
          const name = line.includes(",") ? line.split(",").slice(1).join(",").trim() : "Unknown";
          const groupMatch = line.match(/group-title="([^"]*)"/i);
          const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
          current = {
            name,
            group: groupMatch && groupMatch[1] ? groupMatch[1].trim() : "LAINNYA",
            logo: logoMatch ? logoMatch[1].trim() : "",
            hasDrm: false
          };
        } else if (line.startsWith("#KODIPROP") && current) {
          current.hasDrm = true;
        } else if (/^https?:\/\//i.test(line) && current) {
          current.url = line;
          items.push(current);
          current = null;
        }
      }
      return items;
    }

    function playStream(ch, element) {
      document.querySelectorAll(".channel-item").forEach(el => el.classList.remove("active"));
      if (element) element.classList.add("active");

      currentTitleEl.textContent = `${ch.name} (${ch.group})`;

      if (window.location.protocol === "https:" && ch.url.startsWith("http://")) {
        playerStatusEl.textContent = "Peringatan: Link HTTP (diblokir HTTPS browser)";
      } else if (ch.hasDrm) {
        playerStatusEl.textContent = "Info: Stream ber-DRM (mungkin butuh OTT Navigator)";
      } else {
        playerStatusEl.textContent = "Memuat stream...";
      }

      if (hls) {
        hls.destroy();
        hls = null;
      }

      const isMp4 = /\.(mp4|mkv|webm)(\?|$)/i.test(ch.url);

      if (!isMp4 && Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(ch.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          playerStatusEl.textContent = "Memutar (HLS)";
          video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) {
            playerStatusEl.textContent = "Gagal memutar (CORS / Offline / DRM)";
          }
        });
      } else {
        video.src = ch.url;
        video.onloadeddata = () => { playerStatusEl.textContent = "Memutar (Direct)"; };
        video.onerror = () => { playerStatusEl.textContent = "Gagal memutar di browser"; };
        video.play().catch(() => {});
      }
    }

    function renderList() {
      const selectedGroup = groupFilterEl.value;
      const keyword = searchInputEl.value.toLowerCase().trim();

      const filtered = allChannels.filter(ch => {
        const matchGroup = selectedGroup === "ALL" || ch.group === selectedGroup;
        const matchKeyword = !keyword || ch.name.toLowerCase().includes(keyword);
        return matchGroup && matchKeyword;
      });

      counterEl.textContent = `${filtered.length} / ${allChannels.length} item`;
      channelListEl.innerHTML = "";

      // Batasi render awal maksimal 300 item agar browser tetap ringan
      filtered.slice(0, 300).forEach(ch => {
        const div = document.createElement("div");
        div.className = "channel-item";
        div.innerHTML = `
          <img src="${ch.logo || 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%2364748b%22><rect width=%2224%22 height=%2224%22 rx=%224%22/></svg>'}" loading="lazy" onerror="this.style.visibility='hidden'">
          <div class="channel-info">
            <div class="channel-name">${ch.name}</div>
            <div class="channel-group">${ch.group}</div>
          </div>
        `;
        div.onclick = () => playStream(ch, div);
        channelListEl.appendChild(div);
      });
    }

    async function init() {
      try {
        const res = await fetch(M3U_URL);
        const text = await res.text();
        allChannels = parseM3U(text);

        const groups = [...new Set(allChannels.map(c => c.group))].sort();
        groups.forEach(g => {
          const opt = document.createElement("option");
          opt.value = g;
          opt.textContent = g;
          groupFilterEl.appendChild(opt);
        });

        renderList();
      } catch (err) {
        counterEl.textContent = "Gagal memuat daftar2_full.m3u";
      }
    }

    groupFilterEl.addEventListener("change", renderList);
    searchInputEl.addEventListener("input", renderList);
    init();
  </script>
</body>
</html>
